{% extends 'myblog/base.html' %}
{% load static %}

{% block title %}Supprimer l'article - Mon Blog{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="card-title mb-4">Supprimer l'article</h1>
                    
                    <p class="mb-4">Êtes-vous sûr de vouloir supprimer l'article "{{ post.title }}" ?</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                            <a href="{% url 'post_detail' post.slug %}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
